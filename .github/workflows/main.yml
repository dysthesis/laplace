name: Nix flake check

on: [push, pull_request, workflow_dispatch]

jobs:
  check-input:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@main
  check-expressions:
    name: Check flake expressions
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      # nix is already on the runner (host backend, hostPackages); no install step.
      # pipe-operators is enabled explicitly because the flake uses |>, and the
      # host's nix.conf may not have it on.
      - run: nix flake check --all-systems --extra-experimental-features pipe-operators
