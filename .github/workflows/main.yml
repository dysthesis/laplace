name: Nix flake check

on: [push, pull_request, workflow_dispatch]

jobs:
  check-input:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Check flake inputs
        # The action binary cannot execute on this runner (EACCES).
        run: nix run --extra-experimental-features 'nix-command flakes' nixpkgs#flake-checker
  check-expressions:
    name: Check flake expressions
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      # The runner can disable these Nix features.
      # Cache downloads can stop before completion.
      - run: |
          for attempt in 1 2 3; do
            nix flake check --all-systems \
              --extra-experimental-features 'nix-command flakes pipe-operators' && exit 0
            echo "::warning::flake check attempt $attempt failed; retrying" >&2
            sleep 5
          done
          exit 1
