"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$username$hostname$directory$git_branch$git_status$nix_shell$fill$rust$cmd_duration
$status$character"""

palette = 'lackluster'

[palettes.lackluster]
fg = '#ffffff'
luster = '#deeeed'
lack = '#708090'
orange = '#ffaa88'
green = '#789978'
blue = '#7788aa'
red = '#d70000'
gray5 = '#555555'
gray6 = '#7a7a7a'

[username]
show_always = false            # renders only for root / non-default user
format = '[$user](bold red)[@](gray5)'

[hostname]
ssh_only = true                # blue = not your machine
format = '[$hostname](bold blue)  '

[directory]
style = 'bold fg'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true        # never truncate above the repo root
read_only = ' 󰌾'
read_only_style = 'orange'
format = '[$path]($style)[$read_only]($read_only_style)  '

[git_branch]
symbol = ' '
style = 'lack'
format = '[$symbol$branch]($style) '

[git_status]
style = 'lack'
format = '([$staged$modified$untracked$stashed$ahead_behind]($style))'
staged = '[+$count ](orange)'
modified = '[!$count ](orange)'
untracked = '[?$count ](gray6)'
stashed = '[*$count ](gray6)'
ahead = '[⇡$count ](lack)'
behind = '[⇣$count ](lack)'
diverged = '[⇡$ahead_count⇣$behind_count ](orange)'
conflicted = '[✖$count ](red)'

[nix_shell]
symbol = ' '
style = 'lack'
format = '[$symbol dev]($style) '

[rust]
symbol = ' '
style = 'gray6'
format = '[$symbol$version]($style) '

[fill]
symbol = ' '

[cmd_duration]
min_time = 2000
style = 'orange'
format = '[took $duration]($style) '

[status]
disabled = false
format = '[✗ $status ]($style)'
style = 'red'

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](lack)'

[package]
disabled = true

[time]
disabled = true
