sub-auto=fuzzy
# Allow extension-mismatched streams; mpv#15973.
demuxer-lavf-o=extension_picky=0
osd-bar=no
force-window=yes
hidpi-window-scale=no
keep-open=yes
keep-open-pause=no
osd-on-seek=no
script-opts=osc-seekbarstyle=knob,osc-deadzonesize=1,osc-minmousemove=1
sub-codepage=gbk
osd-font="SF Pro Display"
sub-font="SF Pro Display"
hwdec=auto-safe
profile=high-quality

blend-subtitles=no
sub-bold=yes
sub-font-size=24
sub-blur=2.25
sub-border-color='#000000ff'
sub-back-color='#000000ff'
sub-back-color='#cc000000'
sub-border-style=background-box
sub-use-margins=yes
sub-margin-y=30
sub-margin-x=60
sub-border-size=0.1
sub-shadow-offset=0
sub-pos=89

force-seekable=yes
force-window=yes
keep-open=yes
save-position-on-quit=yes
