creation_rules:
  # Shared Cloudflare DNS-01 token: every node running a per-app Caddy needs it.
  # Tight recipient set (these hosts + admins), not a catch-all shared file.
  - path_regex: system/secrets/cloudflare\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *erebus
          - *mneme
          - *mimir
          - *hermes
          - *bifrost
  - path_regex: system/secrets/portunus\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *erebus
          - *portunus
  - path_regex: system/secrets/mimir\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *erebus
          - *mimir
  - path_regex: system/secrets/horos\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *erebus
          - *horos
  - path_regex: system/secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *erebus
