creation_rules:
  # Shared Cloudflare DNS-01 token: every node running a per-app Caddy needs it.
  # Tight recipient set (these hosts + admins), not a catch-all shared file.
  - path_regex: system/secrets/cloudflare\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *mneme
          - *mimir
          - *hermes
          - *bifrost
  - path_regex: system/secrets/portunus\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *portunus
  - path_regex: system/secrets/charon\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *charon
  - path_regex: system/secrets/mimir\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *mimir
  - path_regex: system/secrets/mneme\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *mneme
  - path_regex: system/secrets/hermes\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *hermes
  - path_regex: system/secrets/bifrost\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *bifrost
  - path_regex: system/secrets/loki\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *loki
  - path_regex: system/secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
