creation_rules:
  # Per-node Cloudflare DNS-01 tokens (F3): the token lives as a `cloudflare_api_key`
  # key inside each Caddy host's own secret file below (hermes/mneme/mimir.yaml),
  # NOT a shared file — so each node holds ONLY its own token (distinct token per
  # node => independent revocation + leak attribution; each is still Zone:DNS:Edit,
  # a token can't be scoped narrower than a zone). The per-host rules below already
  # encrypt those files to {deimos, phobos, <host>}. bifrost is no longer a
  # recipient — it never ran Caddy DNS-01 (its headscale TLS terminates at
  # portunus), so it had no business holding the zone-wide token.
  - path_regex: system/secrets/portunus\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *portunus
  - path_regex: system/secrets/charon\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *charon
  - path_regex: system/secrets/hephaestus\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *hephaestus
  - path_regex: system/secrets/mimir\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *mimir
  - path_regex: system/secrets/mneme\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *mneme
  - path_regex: system/secrets/hermes\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *hermes
  - path_regex: system/secrets/bifrost\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *bifrost
  - path_regex: system/secrets/loki\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
          - *loki
  - path_regex: system/secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deimos
          - *phobos
