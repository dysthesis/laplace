[general]
	# False client values override true server values only on this client.
	dummySetting = true
	# Send relative mouse positions and clicks.
	sendMouseInfo = true
	# Send the typing rate. False uses the server default.
	sendTypingSpeed = true
	sendActiveGui = true
	sendIdleState = true
	showIdleStatesInPlayerList = true
	showIdleStatesInPlayerAboveHead = true
	showPlayerAnimations = true
	showPlayerAnimation_Typing = true
	showPlayerAnimation_Idle = true
	# Show non-typing GUI animations, such as head turns, arm movements, and mouse clicks.
	showPlayerAnimation_Gui = true
	# Show non-chat GUIs in the world.
	showPlayerActiveNonChatGui = true
	# Show the chat GUI in the world.
	showPlayerActiveChatGui = true
	# For the simple GUI visual, use a Chest GUI when no exact match exists.
	# False shows nothing for unmatched GUIs.
	showPlayerActiveGuiIfNotExactMatch = true
	# Show 'Player is typing...' on the chat screen.
	screenTypingVisible = true
	# Set the X position of 'Player is typing...' in the chat GUI.
	#Range: > 0
	screenTypingRelativePosition_X = 0
	# Set the Y position of 'Player is typing...' in the chat GUI.
	#Range: > 0
	screenTypingRelativePosition_Y = 0
	# Use screenTypingMultiplePlayersText above this character limit.
	#Range: > 0
	screenTypingCharacterLimit = 50
	# Use this text when screenTypingCharacterLimit is exceeded.
	screenTypingMultiplePlayersText = "Several people are typing"
	# Append this text to the typing player's name.
	screenTypingText = " is typing"
	# Play a sound when players open supported GUIs.
	playScreenOpenSounds = true
	# Play a quiet sound for mouse clicks in GUIs.
	playMouseClickSounds = true
	# Scale the GUI visual in front of players. Use 2 for twice the size.
	#Range: 0.1 ~ 1.7976931348623157E308
	particleSizeScale = 1.0
	# Set the minimum GUI update interval in ticks. Use 10 for two updates per second.
	# This can only increase the interval set by the server or other client.
	#Range: > 0
	tickReceiveAndRenderRateOfGUIUpdates = 10
	# Use true to hide screen details and show only the basic GUI visual.
	dontSendDetailedGUIInfo = false
	# Use true to hide item transfers between the player and containers.
	dontSendItemInfo = false
