[misc]
	#Range: 16 ~ 128
	switchPlacementRange = 64
	# Let trains control Brass Switches remotely on approach.
	flipDistantSwitches = true
	# Multiply handcar exhaustion from speed by this factor.
	#Range: 0.0 ~ 1.0
	handcarHungerMultiplier = 0.009999999776482582
	# Require coupler points on the same or adjacent track edges, with no junction between them.
	strictCoupler = false
	rollersClearSnow = true
	# Let Creative Mode players relocate trains without distance limits.
	#[@cui:RequiresRelog]
	unlimitedCreativeRelocation = false
	# Let creepers and ghast fireballs damage tracks.
	creeperTrackDamage = false

[semaphores]
	# Reverse semaphore colour order when upside down.
	flipYellowOrder = false
	# Prevent upside-down semaphore placement.
	simplifiedPlacement = true

[conductors]
	#Range: > 1
	maxConductorVentLength = 64
	# Restrict conductor whistles to train owners.
	mustOwnBoundTrain = false
	# Update the bound conductor's train at this interval.
	#Range: 1 ~ 600
	whistleRebindRate = 10

[realism]
	# Accept only liquid fuels in fuel tanks, not water or other liquids.
	realisticFuelTanks = true
	# Require liquid fuel from tanks or solid fuel from chests and barrels.
	realisticTrains = false
