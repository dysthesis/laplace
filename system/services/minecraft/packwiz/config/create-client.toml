# General settings are in the world's serverconfig folder.
[client]
	# Choose the main menu row for the Create config button. Use 0 to hide it.
	#Range: 0 ~ 4
	mainMenuConfigButtonRow = 2
	# Choose the in-game menu row for the Create config button. Use 0 to hide it.
	#Range: 0 ~ 5
	ingameMenuConfigButtonRow = 3
	# Higher density produces more particles.
	#Range: 0.0 ~ 1.0
	fanParticleDensity = 0.5
	# Disable this to keep the view fixed on a Moving Contraption seat.
	rotateWhenSeated = true
	# Log a stack trace for render errors within a moving contraption.
	explainRenderErrors = false
	#Example: 1000 mB or 81000 Droplets
	#Allowed Values: DROPLETS, MILLIBUCKETS
	fluidUnitType = "MILLIBUCKETS"
	#[in Blocks]
	# Show filter slot items up to this distance from the player.
	#Range: 1.0 ~ 3.4028234663852886E38
	filterItemRenderDistance = 10.0
	# Set the vertical Toolbox Hotbar overlay offset.
	#Range: > -2147483648
	toolboxHotbarOverlayOffset = 0
	# Show a tooltip for overstressed components.
	enableOverstressedTooltip = true
	simplifyFluidUnit = true
	# Offset the in-game config button along the X axis in pixels.
	# Negative values place it on the left. Positive values place it on the right.
	#Range: > -2147483648
	ingameMenuConfigButtonOffsetX = -4
	# Suppress the Create warning for Fabulous graphics.
	ignoreFabulousWarning = false
	# Offset the main menu config button along the X axis in pixels.
	# Negative values place it on the left. Positive values place it on the right.
	#Range: > -2147483648
	mainMenuConfigButtonOffsetX = -4
	# Show item descriptions with Shift and controls with Ctrl.
	enableTooltips = true

	[client.fluidFogSettings]
		# Multiply visibility through honey by this factor.
		#Range: 0.125 ~ 256.0
		honey = 1.0
		# Multiply visibility through chocolate by this factor.
		#Range: 0.125 ~ 256.0
		chocolate = 1.0

	[client.sound]
		enableAmbientSounds = true
		#Range: 0.0 ~ 1.0
		ambientVolumeCap = 0.10000000149011612

	[client.trains]
		# Multiply the camera zoom by this factor on a train seat.
		#Range: 0.0 ~ 3.4028234663852886E38
		mountedZoomMultiplier = 3.0
		# Show Rail Network materials in F3 debug mode.
		showExtendedTrackGraphOnF3 = false
		# Show Railway Network nodes and edges in F3 debug mode.
		showTrackGraphOnF3 = false
		#Allowed Values: RED, GREY, WHITE
		trainMapColorTheme = "RED"
		# Show Track Networks and Trains on supported maps.
		showTrainMapOverlay = true

	[client.goggleOverlay]
		# Use custom colours for Goggle and Hover Overlays.
		customColorsOverlay = false
		# Set the Goggle and Hover Overlay Y offset in pixels. Use /create overlay.
		#Range: > -2147483648
		overlayOffsetY = 0
		# Set the Goggle and Hover Overlay X offset in pixels. Use /create overlay.
		#Range: > -2147483648
		overlayOffsetX = 20
		# Use this colour at the top of the Goggle and Hover Overlay border gradient.
		#[in Hex: #AaRrGgBb]
		#[@cui:IntDisplay:#]
		#Range: > -2147483648
		customBorderTopOverlay = 1347420415
		# Use this background colour for the Goggle and Hover Overlays.
		#[in Hex: #AaRrGgBb]
		#[@cui:IntDisplay:#]
		#Range: > -2147483648
		customBackgroundOverlay = -267386864
		# Use this colour at the bottom of the Goggle and Hover Overlay border gradient.
		#[in Hex: #AaRrGgBb]
		#[@cui:IntDisplay:#]
		#Range: > -2147483648
		customBorderBotOverlay = 1344798847

	[client.jeiIntegration]
		# Update the JEI search to match the stock keeper search.
		syncJeiSearch = true
