# Players try to use sleeping bags on placement.
autoUse = true
# If true, players must wait before they can sleep again.
restrictSleeping = false
# Higher values reduce the wait when restrictSleeping is true.
#Range: 1.0 ~ 20.0
restMultiplier = 2.0
#Allowed Values: NONE, DAY, NIGHT, DAY_OR_NIGHT
hammockUse = "DAY"
#Allowed Values: NONE, DAY, NIGHT, DAY_OR_NIGHT
sleepingBagUse = "NIGHT"
# Use 0 for one player or 100 for all players to skip the day.
# Negative values use the playerSleepingPercentage game rule.
#Range: -1 ~ 100
daySleepingPercentage = -1
# Add or remove this many ticks after a night of sleep.
#Range: -2000 ~ 2000
dayWakeTimeOffset = 0
# Add or remove this many ticks after a day of sleep.
#Range: -2000 ~ 2000
nightWakeTimeOffset = 0
# A sleep attempt in a hammock prevents phantom spawns.
hammocksStopPhantoms = true
# A sleep attempt in a sleeping bag prevents phantom spawns.
sleepingBagsStopPhantoms = true
# Set the chance of sleeping bag breakage as a percentage.
#Range: 0 ~ 100
sleepingBagBreakChance = 0
# Multiply player luck by this value and add the result to sleepingBagBreakChance.
#Range: -1.0 ~ 1.0
sleepingBagBreakChanceLuckMultiplier = 0.0
# Apply these status effects after a sleeping bag use.
#Format: effect;duration(secs);power
sleepingBagEffects = []
