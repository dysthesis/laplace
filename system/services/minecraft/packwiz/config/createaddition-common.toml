# Apply changes to clients and the dedicated server. This configuration does not synchronise between them.
[general]
	# Set Forge Energy generation and consumption in E/t at 256 RPM.
	#Range: > 0
	fe_at_max_rpm = 240
	# Set maximum Alternator and Electric Motor stress in SU at 256 RPM.
	#Range: > 0
	max_stress = 16384
	audio_enabled = true

[electric_motor]
	# Set the Electric Motor minimum and maximum RPM.
	#Range: > 1
	motor_rpm_range = 256
	# Set minimum motor energy consumption in E/t.
	#Range: > 0
	motor_min_consumption = 8
	# Limit motor energy transfer, not consumption, in E.
	#Range: 0 ~ 9223372036854775807
	motor_max_input = 5000
	# Set motor energy capacity in E.
	#Range: 0 ~ 9223372036854775807
	motor_capacity = 5000

[alternator]
	# Limit Alternator energy transfer, not generation, in E.
	#Range: 0 ~ 9223372036854775807
	generator_max_output = 5000
	# Set Alternator energy capacity in E.
	#Range: 0 ~ 9223372036854775807
	generator_capacity = 5000
	# Set Alternator efficiency relative to the base conversion rate.
	#Range: 0.01 ~ 1.0
	generator_efficiency = 0.75

[rolling_mill]
	# Set Rolling Mill duration in ticks.
	#Range: > 0
	rolling_mill_processing_duration = 120
	#Range: 0 ~ 1024
	rolling_mill_stress = 8

[wires]
	# Limit Small Connector input in FE/t.
	#Range: 0 ~ 9223372036854775807
	small_connector_max_input = 1000
	# Limit Small Connector output in FE/t.
	#Range: 0 ~ 9223372036854775807
	small_connector_max_output = 1000
	# Limit Small Connector wire length in blocks.
	#Range: 0 ~ 256
	small_connector_wire_length = 16
	# Set Small Connector With Light consumption in FE/t.
	#Range: 0 ~ 9223372036854775807
	small_light_connector_consumption = 1
	# Limit Large Connector input in FE/t.
	#Range: 0 ~ 9223372036854775807
	large_connector_max_input = 5000
	# Limit Large Connector output in FE/t.
	#Range: 0 ~ 9223372036854775807
	large_connector_max_output = 5000
	# Limit Large Connector wire length in blocks.
	#Range: 0 ~ 256
	large_connector_wire_length = 32
	# Skip the connector support check on block faces.
	connector_ignore_face_check = true
	# Let attached blocks exchange energy with the connector network.
	connector_allow_passive_io = true

[accumulator]
	# Limit Accumulator input in E/t.
	#Range: 0 ~ 9223372036854775807
	accumulator_max_input = 5000
	# Limit Accumulator output in E/t.
	#Range: 0 ~ 9223372036854775807
	accumulator_max_output = 5000
	# Set Accumulator capacity per block in E.
	#Range: 0 ~ 9223372036854775807
	accumulator_capacity = 2000000
	#Range: 1 ~ 8
	accumulator_max_height = 5
	#Range: 1 ~ 8
	accumulator_max_width = 3

[portable_energy_interface]
	# Limit PEI input in E/t.
	#Range: 0 ~ 9223372036854775807
	pei_max_input = 5000
	# Limit PEI output in E/t.
	#Range: 0 ~ 9223372036854775807
	pei_max_output = 5000

[tesla_coil]
	# Limit Tesla Coil input in E/t.
	#Range: 0 ~ 9223372036854775807
	tesla_coil_max_input = 10000
	# Set Tesla Coil charge rate in E/t.
	#Range: 0 ~ 9223372036854775807
	tesla_coil_charge_rate = 5000
	# Set Tesla Coil recipe charge rate in E/t.
	#Range: 0 ~ 9223372036854775807
	tesla_coil_recipe_charge_rate = 2000
	# Set Tesla Coil capacity in E.
	#Range: 0 ~ 9223372036854775807
	tesla_coil_capacity = 40000
	# Use this much energy per Tesla Coil shot in E.
	#Range: 0 ~ 9223372036854775807
	tesla_coil_hurt_energy_required = 1000
	# Limit damage range in blocks (metres).
	#Range: > 0
	tesla_coil_hurt_range = 3
	# Set Tesla Coil damage to mobs in half hearts.
	#Range: > 0
	tesla_coil_hurt_mob = 3
	# Set the Shocked duration for mobs in ticks.
	#Range: > 0
	tesla_coil_effect_time_mob = 20
	# Set Tesla Coil damage to players in half hearts.
	#Range: > 0
	tesla_coil_hurt_player = 2
	# Set the Shocked duration for players in ticks.
	#Range: > 0
	tesla_coil_effect_time_player = 20
	# Set the interval between Tesla Coil shots in ticks.
	#Range: > 0
	tesla_coil_fire_cooldown = 20

[misc]
	# Set Diamond Grit Sandpaper durability in uses.
	#Range: > 3
	diamond_grit_sandpaper_uses = 1024
	#Range: 0.0 ~ 3.4028234663852886E38
	barbed_wire_damage = 2.0
