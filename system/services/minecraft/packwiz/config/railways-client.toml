# General settings are in the world's serverconfig folder.
[client]
	# Use a scanline shader for the conductor spy view.
	useConductorSpyShader = true
	# Apply developer capes only for developers. Reconnect if the change has no effect.
	useDevCape = true
	# Let all wrenches fill `/snr shadow_realm banish` on sneak-use without the ShadowHammer tag.
	universalShadowWrench = false
	showExtendedCouplerDebug = false
	# Render the standard Create conductor cap above the existing hat.
	renderNormalCap = true
	#Range: -256.0 ~ 256.0
	trackOverlayOffset = 0.0
	# Skip client derailment to prevent stutter as trains place tracks.
	# Crashed trains will not look derailed.
	skipClientDerailing = false
	# Animate flywheels and FlywheelBlock subclasses on trains.
	animatedFlywheels = true

	[client.smoke]
		#Allowed Values: VANILLA, OLD, CARTOON
		smokeType = "CARTOON"

		[client.smoke.cartoon]
			# Produce faster small smoke puffs at intervals.
			spawnFasterPuffs = true
			# Produce steam at intervals.
			spawnSteam = false

		[client.smoke.old]
			#Range: 0.0 ~ 10.0
			smokePercentage = 0.75
			# Add two layers per particle for thicker smoke.
			thickerSmoke = true
			#[in Ticks]
			#Range: 20 ~ 1000
			smokeLifetime = 500
			#Allowed Values: LOW, MEDIUM, HIGH, ULTRA
			smokeQuality = "HIGH"
