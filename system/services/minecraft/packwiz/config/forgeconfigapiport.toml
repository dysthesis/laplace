# Correct invalid values from defaultconfigs before the built-in defaults.
correctConfigValuesFromDefaultConfig = true
# Load defaults for new worlds and recreated client or common configurations from this path.
defaultConfigsPath = "defaultconfigs"
# Recreate the file and retry after com.electronwill.nightconfig.core.io.ParsingException: Not enough data available.
# If the retry fails, throw the original exception.
# Keep custom defaults in defaultconfigs so they survive recreation.
recreateConfigsWhenParsingFails = true
# Store server configurations in .minecraft/config/, not individual world directories.
forceGlobalServerConfigs = true
