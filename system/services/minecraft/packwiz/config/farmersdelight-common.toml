[settings]
	# Allow 3x3 crates for vanilla crops.
	enableVanillaCropCrates = true
	# Add this fraction to Cutting Board chances for each Fortune level. Use 0.0 to disable the bonus.
	#Range: 0.0 ~ 1.0
	cuttingBoardFortuneBonus = 0.1
	# Let Novice and Apprentice Farmers buy mod crops. This can reduce other trades.
	farmersBuyFDCrops = true
	# Let players reel rope from bottom to top with empty-hand sneak-use.
	enableRopeReeling = true
	# Set the chance of Rich Soil growth boosts per random tick. Use 0.0 to disable boosts.
	#Range: 0.0 ~ 1.0
	richSoilBoostChance = 0.2
	# Use white text on Canvas Signs with these background dye colours.
	#Dyes: ["white", "orange", "magenta", "light_blue", "yellow", "lime", "pink", "gray", "light_gray", "cyan", "purple", "blue", "brown", "green", "red", "black"]
	canvasSignDarkBackgroundList = ["gray", "purple", "blue", "brown", "green", "red", "black"]
	# Let the Wandering Trader sell mod items, including crop seeds and onions.
	wanderingTraderSellsFDItems = true

[farming]
	# Let Tomato Vines climb blocks tagged as farmersdelight:ropes.
	# Vines convert these blocks to defaultTomatoVineRope.
	enableTomatoVineClimbingTaggedRopes = true
	# Tomato Vines leave this rope after removal by hand.
	defaultTomatoVineRope = "farmersdelight:rope"

[recipe_book]
	enableRecipeBookCookingPot = true

[overrides]
	rabbitStewJumpBoost = true
	# Let Dispensers operate Cutting Boards in front of them.
	dispenserUsesToolsOnCuttingBoard = true
	# Give vanilla soups and stews extra effects.
	vanillaSoupExtraEffects = true

	[overrides.stack_size]
		# Let listed BowlFoodItems stack to 16.
		enableStackableSoupItems = true
		# Items must extend BowlFoodItem. The default list contains vanilla soups and stews.
		soupItemList = ["minecraft:mushroom_stew", "minecraft:beetroot_soup", "minecraft:rabbit_stew"]

[world]
	# Add mod items, such as ropes, seeds, knives and meals, to chest loot.
	generateFDChestLoot = true
	# Plant mod crops in village farms.
	genFDCropsOnVillageFarms = true
	# Generate Compost Heaps in all village biomes.
	genVillageCompostHeaps = true

	[world.wild_beetroots]
		# Lower values produce more frequent clusters.
		#Range: > 0
		chance = 30

	[world.wild_tomatoes]
		# Lower values produce more frequent clusters.
		#Range: > 0
		chance = 100

	[world.wild_cabbages]
		# Lower values produce more frequent clusters.
		#Range: > 0
		chance = 30

	[world.wild_onions]
		# Lower values produce more frequent clusters.
		#Range: > 0
		chance = 120

	[world.wild_potatoes]
		# Lower values produce more frequent clusters.
		#Range: > 0
		chance = 100

	[world.red_mushroom_colonies]
		# Lower values produce more frequent clusters.
		#Range: > 0
		chance = 15
		# Generate red mushroom colonies on mushroom fields.
		genRedMushroomColony = true

	[world.wild_carrots]
		# Lower values produce more frequent clusters.
		#Range: > 0
		chance = 120

	[world.brown_mushroom_colonies]
		# Lower values produce more frequent clusters.
		#Range: > 0
		chance = 15
		# Generate brown mushroom colonies on mushroom fields.
		genBrownMushroomColony = true

	[world.wild_rice]
		# Lower values produce more frequent clusters.
		#Range: > 0
		chance = 20
