
damageOnFall = 19

# Allow these dimension IDs. Options such as triggerInOverworld take priority.
dimensionAllowList = [  ]

# Deny these dimension IDs only if dimensionAllowList is empty. Options such as triggerInOverworld take priority.
dimensionDenyList = [  ]

# Disable vanilla anti-cheat if void falls cause rubber-banding.
# Public servers must have another anti-cheat system before this option is enabled.
disableVanillaAntiCheatWhileFalling = true

# Set the return height after a void fall.
fallingHeight = 300

# Limit fall damage to leave at least 0.5 hearts.
preventDeath = false

# Return players to the sky at this distance below the minimum Y level.
triggerAtDistanceBelow = 32

# False disables Forgiving Void in the End (dimension 1).
triggerInEnd = true

# False disables Forgiving Void in the Nether (dimension -1).
triggerInNether = true

# False disables Forgiving Void in the Overworld (dimension 0).
triggerInOverworld = true

