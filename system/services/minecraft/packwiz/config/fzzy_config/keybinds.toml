# Do not change this version. It controls configuration updates.
# Each binding type is 'keyboard' or 'mouse'. Use a key name or integer keycode.
# Convert 'key.keyboard.pause' to 'pause' and 'key.mouse.right' to 'mouse.right'.
version = 1


[pageUp]
ctrl = "default"
shift = "default"
alt = "default"
type = "keyboard"
key = "page.up"


[pageDown]
ctrl = "default"
shift = "default"
alt = "default"
type = "keyboard"
key = "page.down"


[home]
ctrl = "default"
shift = "default"
alt = "default"
type = "keyboard"
key = "home"


[end]
ctrl = "default"
shift = "default"
alt = "default"
type = "keyboard"
key = "end"


[copy]
ctrl = "true"
shift = "false"
alt = "false"
type = "keyboard"
key = "c"


[paste]
ctrl = "true"
shift = "false"
alt = "false"
type = "keyboard"
key = "v"

# Fzzy Config does not use this cut binding.

[cut]
ctrl = "true"
shift = "false"
alt = "false"
type = "keyboard"
key = "x"

# Save configuration changes and send updates to the server.

[save]
ctrl = "true"
shift = "false"
alt = "false"
type = "keyboard"
key = "s"


[undo]
ctrl = "true"
shift = "false"
alt = "false"
type = "keyboard"
key = "z"

# Open the context menu for the selected element or the element under the pointer.

[contextMouse]
ctrl = "default"
shift = "default"
alt = "default"
type = "mouse"
key = "mouse.right"


[back]
ctrl = "default"
shift = "default"
alt = "default"
type = "keyboard"
key = "backspace"

# Open the 'Go-To' menu, not the search bar.

[search]
ctrl = "true"
shift = "false"
alt = "false"
type = "keyboard"
key = "e"


[info]
ctrl = "default"
shift = "default"
alt = "default"
type = "keyboard"
key = "f1"

# Close all configuration GUIs and save changes where applicable.

[fullExit]
ctrl = "false"
shift = "true"
alt = "false"
type = "keyboard"
key = "escape"


[[find]]
ctrl = "true"
shift = "false"
alt = "false"
type = "keyboard"
key = "f"

[[find]]
ctrl = "false"
shift = "false"
alt = "false"
type = "keyboard"
key = "f3"

# Open the context menu for the selected element or the element under the pointer.

[[contextKeyboard]]
ctrl = "false"
shift = "true"
alt = "false"
type = "keyboard"
key = "f10"

[[contextKeyboard]]
ctrl = "false"
shift = "false"
alt = "false"
type = "keyboard"
key = "menu"

# Fzzy Config does not use this universal 'Enter' binding.

[[act]]
ctrl = "false"
shift = "false"
alt = "false"
type = "keyboard"
key = "enter"

[[act]]
ctrl = "false"
shift = "false"
alt = "false"
type = "keyboard"
key = "keypad.enter"