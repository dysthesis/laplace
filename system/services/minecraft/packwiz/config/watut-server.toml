[general]
	# False server values override true client values for all clients.
	dummySetting = true
	# Use the simple GUI visual.
	dynamicGuiUseOldSimpleGUIVisual = false
	# Set the GUI image update interval in ticks. Use 10 for two updates per second.
	# Shorter intervals increase CPU and network load.
	#Range: > 5
	dynamicGuiTickSendRateOfGUIUpdates = 10
	# Send only the first GUI image, without later updates.
	dynamicGuiDontSendConstantGUIUpdates = false
	# Blur reduces aliasing and flicker but also reduces clarity.
	#Range: 0 ~ 2
	dynamicGuiBlurLevel = 1
	# Limit the GUI display circle radius in pixels. Large values can cause visual errors.
	# Use -1 to disable the limit.
	#Range: 4.9E-324 ~ 1.7976931348623157E308
	dynamicGuiSizeRadiusInPixelsToShow = 112.0
	# Show the entire client screen. This experimental option increases CPU and network load.
	# Set dynamicGuiSizeRadiusInPixelsToShow to -1 or a large value.
	dynamicGuiShowClientsEntireScreen = false
	# Omit GUI backgrounds. This can hide JEI and other background content.
	dynamicGuiDisableBackgroundRendering = true
	showItemsBeingTransferredBetweenPlayerAndContainer = true
	# Show GUI activity, item transfers and mouse movements within this distance of another player.
	#Range: > 0
	distanceRequiredToShowGUIInfo = 10
	showIdleStatesInPlayerList = true
	showIdleStatesInPlayerAboveHead = true
	showPlayerAnimations = true
	showPlayerAnimation_Typing = true
	showPlayerAnimation_Idle = true
	# Show non-typing GUI animations, such as head turns, arm movements, and mouse clicks.
	showPlayerAnimation_Gui = true
	# Show non-chat GUIs in the world.
	showPlayerActiveNonChatGui = true
	# Show the chat GUI in the world.
	showPlayerActiveChatGui = true
	# Show 'Player is typing...' on the chat screen.
	screenTypingVisible = true
	# Play a sound when players open supported GUIs.
	playScreenOpenSounds = true
	# Play a quiet sound for mouse clicks in GUIs.
	playMouseClickSounds = true
