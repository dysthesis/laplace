[client]

# Let waystone text use normal brightness.
disableTextGlow = false

[compatibility]

# Create JourneyMap waypoints for activated waystones.
displayWaystonesOnJourneyMap = true

# Create waypoints only if JourneyMap Integration is absent.
preferJourneyMapIntegration = true

[cooldowns]

# Multiply the global waystone cooldown for inventory button and warp stone travel.
globalWaystoneCooldownMultiplier = 1.0

# Set the inventory button cooldown in seconds.
inventoryButtonCooldown = 300

# Hold right-click for this many ticks to use a scroll.
scrollUseTime = 32

# Stand on a warp plate for this many ticks to use it.
warpPlateUseTime = 20

# Set the warp stone cooldown in seconds per player. All the player's warp stones share it.
warpStoneCooldown = 300

# Hold right-click for this many ticks to use a warp stone.
warpStoneUseTime = 32

[inventoryButton]

creativeWarpButtonX = 88

creativeWarpButtonY = 33

# Use 'NONE' for no button, 'NEAREST' for the nearest waystone, or 'ANY' for a selection menu.
# A waystone name makes the button teleport to that waystone.
inventoryButton = ""

warpButtonX = 58

warpButtonY = 60

[restrictions]

# Permit travel between waystones with a right-click.
allowWaystoneToWaystoneTeleport = true

# Use 'ALLOW' for all dimensional warps, 'GLOBAL_ONLY' for global waystones, or 'DENY' for no dimensional warps.
dimensionalWarp = "ALLOW"

# Allow dimensional travel between these dimensions. An empty list permits all except dimensionalWarpDenyList.
dimensionalWarpAllowList = [  ]

# Deny dimensional travel through these dimensions only if dimensionalWarpAllowList is empty.
dimensionalWarpDenyList = [  ]

generatedWaystonesUnbreakable = false

# False lets non-Creative Mode players activate global waystones for all players.
globalWaystoneSetupRequiresCreativeMode = true

leashedDenyList = [ "minecraft:wither" ]

restrictRenameToOwner = false

# Restrict placement, changes and removal to Creative Mode players. The crafting recipe remains active.
restrictToCreative = false

transportLeashed = true

transportLeashedDimensional = true

[worldGen]

# The nameGenerationMode option uses these preset names.
customWaystoneNames = [  ]

# Generate waystones in these dimensions. An empty list permits all except dimensionDenyList.
dimensionAllowList = [ "minecraft:overworld", "minecraft:the_nether", "minecraft:the_end" ]

# Exclude these dimensions from generation only if dimensionAllowList is empty.
dimensionDenyList = [  ]

# Generate waystones early so most villages have one near the centre.
forceSpawnInVillages = false

# Set approximate distance between generated waystones in chunks. Use 0 to disable generation.
frequency = 25

# PRESET_FIRST uses custom names first. PRESET_ONLY uses only custom names.
# MIXED uses custom and random names.
nameGenerationMode = "PRESET_FIRST"

# Add waystones to village generation. Some villages can still have no waystone.
spawnInVillages = true

# DEFAULT uses the normal texture. MOSSY and SANDY select those variants. BIOME selects the style from the biome.
worldGenStyle = "BIOME"

[xpCost]

# Set blocks per XP level. At 500 blocks per level, 1000 blocks costs 2 levels.
blocksPerXpLevel = 1000

# Set the base XP level cost for dimensional travel, independent of distance.
dimensionalWarpXpCost = 3

globalWaystoneXpCostMultiplier = 1.0

inventoryButtonXpCostMultiplier = 0.0

# Charge more XP for shorter distances to encourage other travel methods.
inverseXpCost = false

# Limit base XP cost before multipliers. Use 0 to disable distance-based XP costs.
maximumBaseXpCost = 3.0

# Set the minimum base XP cost before multipliers.
minimumBaseXpCost = 0.0

portstoneXpCostMultiplier = 0.0

sharestoneXpCostMultiplier = 1.0

warpPlateXpCostMultiplier = 0.0

# Apply this multiplier to Warp Stone item travel, not Waystone block travel.
warpStoneXpCostMultiplier = 0.0

waystoneXpCostMultiplier = 1.0

# Charge this much XP per leashed animal.
xpCostPerLeashed = 1

