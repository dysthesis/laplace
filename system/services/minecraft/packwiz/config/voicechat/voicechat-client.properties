
# Do not change this version. It controls configuration migration.
config_version=1
onboarding_finished=true
voice_chat_volume=0.9909090909090912
# Set the voice activation threshold in dB.
voice_activation_threshold=-9.621212121212126
voice_activity_detection=true
microphone_gain=0.0
automatic_gain_control=true
# Valid values are 'PTT' and 'VOICE'
microphone_activation_type=PTT
# Set the audio output buffer size in packets.
# Larger buffers increase latency but reduce crackle on unstable internet connections.
output_buffer_size=5
# Hold up to this many audio packets for missing or out-of-order packets. Use 0 to disable.
audio_packet_threshold=3
# Set microphone deactivation delay for voice activation in units of 20 milliseconds.
voice_deactivation_delay=25
# Set microphone deactivation delay for push-to-talk in units of 20 milliseconds.
ptt_deactivation_delay=5
# Leave the microphone blank to use the default device.
microphone=Brio 100 Mono
# Leave the speaker blank to use the default device.
speaker=Starship/Matisse HD Audio Controller Analog Stereo
# This mute setting applies only to voice activation.
muted=false
# Disable both audio output and the microphone.
disabled=false
# Hide voice chat and group chat HUDs and other in-game icons.
hide_icons=true
show_nametag_icons=true
show_hud_icons=true
show_group_hud=true
show_own_group_icon=true
group_hud_icon_scale=2.0
# Valid values are 'VERTICAL' and 'HORIZONTAL'
group_player_icon_orientation=VERTICAL
# Negative X values anchor group icons to the right.
group_player_icon_pos_x=4
# Negative Y values anchor group icons to the bottom.
group_player_icon_pos_y=4
# Negative X values anchor HUD icons to the right.
hud_icon_pos_x=16
# Negative Y values anchor HUD icons to the bottom.
hud_icon_pos_y=-16
hud_icon_scale=1.0
# Leave the recording destination blank to use the default location.
recording_destination=
# Use 0 for the highest recording quality or 9 for the lowest quality.
recording_quality=2
denoiser=true
# Run voice chat in singleplayer and LAN worlds.
run_local_server=true
# True uses Java microphone capture. False uses OpenAL only where the OS and Minecraft version support it.
java_microphone_implementation=false
# Check microphone permissions only on macOS.
macos_check_microphone_permission=true
show_fake_players_disconnected=false
# Include offline players in the volume controls.
offline_player_volume_adjustment=false
# Valid values are 'NORMAL', 'REDUCED', and 'OFF'
audio_type=NORMAL
# False uses Java Opus without automatic gain control, noise suppression or audio recording.
use_natives=true
# CAMERA uses audio around the camera, subject to the server broadcast range.
# PLAYER uses audio around the player, independent of the camera position.
freecam_mode=CAMERA
# Mute the microphone on world entry.
mute_on_join=false
