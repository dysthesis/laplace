
# Audio always uses UDP on this port. Use -1 to match the Minecraft server port.
# Keep a separate port to avoid server query conflicts that can crash the server.
port=24454
# Leave blank to use server-ip from server.properties. Use '*' for the wildcard address.
bind_address=
max_voice_distance=48.0
whisper_distance=24.0
# Valid values are 'VOIP', 'AUDIO', and 'RESTRICTED_LOWDELAY'
codec=VOIP
# Limit audio packet size in bytes. Smaller limits can cause errors.
mtu_size=1275
# Limit voice chat control packets per player per second over Minecraft networking.
# Use -1 for no limit. Other values must exceed 0.
# This affects group actions and voice chat state changes.
tcp_rate_limit=16
# Set the keep-alive interval in milliseconds. Larger intervals can cause timeouts.
keep_alive=1000
enable_groups=true
# Set the client connection hostname, hostname:port or port, such as 'example.com:24454' or '24454'.
voice_host=
allow_recording=true
spectator_interaction=false
# Let spectators talk to the players they spectate.
spectator_player_possession=false
# Reject players without the voice chat mod.
force_voice_chat=false
# Wait this many milliseconds for the client mod check when force_voice_chat is true.
login_timeout=10000
# Use a negative value to follow max_voice_distance for audio broadcasts.
broadcast_range=-1.0
allow_pings=true
# Native libraries on dedicated servers primarily support voice chat add-ons.
use_natives=true
