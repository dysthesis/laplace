# Slow Ponder scenes while text is visible.
comfyReading = false
# Show more Ponder information and reload scene scripts more often.
editingMode = false

[placementAssist]
	#Range: 0.0 ~ 3.4028234663852886E38
	indicatorScale = 1.0
	# Show the placement result relative to the crosshair. Use 'NONE' to hide the indicator.
	#Allowed Values: TEXTURE, TRIANGLE, NONE
	indicatorType = "TEXTURE"
