migrateCopycatsOnBlockUpdate = true
# Migrate copycats to Create: Copycats+ at block entity initialisation.
migrateCopycatsOnInitialize = true

# Server values override client values.
[features]
	large_crank_wheel = true
	crank_wheel = true
	copycat_wall = true
	copycat_stairs = true
	copycat_fence = true
	copycat_block = true
	copycat_vertical_step = true
	inverted_gearshift = true
	inverted_clutch = true
	empty_fan_catalyst = true
	overstress_clutch = true
	sequenced_pulse_generator = true
	encased_chain_cogwheel = true
	six_way_gearbox = true
	parallel_gearbox = true
	item_silo = true
	copycat_fence_gate = true
	fluid_vessel = true
	inventory_bridge = true
	linked_transmitter = true
	copycat_beam = true
	copycat_board = true
	brass_gearbox = true
	centrifugal_clutch = true
	brake = true
	shear_pin = true
	copycat_slab = true
	inventory_access_port = true
	cross_connector = true
	redstone_link_wildcard = true
	freewheel_clutch = true
	kinetic_bridge = true
	kinetic_battery = true

# Disable a category to hide all its features. Server values override client values.
[feature_categories]
	# Control item and fluid transport components.
	logistics = true
	palette = true
	kinetic = true
	# Install Create: Copycats+ to upgrade copycats.
	copycats = true
	redstone = true
