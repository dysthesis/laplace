version = 3
# (Default: 
#    max(
#        1,
#        min(
#            if( is_windows,
#                (cpus / 1.6 - 2),
#                (cpus / 1.2 - 2)
#            ),
#            if( is_j9vm,
#                ( ( mem_gb - (if(is_client, 0.6, 0.2)) ) / 0.5 ),
#                ( ( mem_gb - (if(is_client, 1.2, 0.6)) ) / 1.2 )
#            )
#        ) - if(is_client, 2, 0)
#    )
# )  
# This expression sets global executor parallelism unless an override supplies it.
# Available variables: is_windows, is_j9vm, is_client, cpus, mem_gb
defaultGlobalExecutorParallelismExpression = "default"
# (Default: 5) Set global executor parallelism.
globalExecutorParallelism = "default"

[fixes]
	# (Default: true)
	# Disable the log4j2 shutdown hook on dedicated servers.
	# The JVM exits when the server completes shutdown. Clients ignore this option.
	disableLoggingShutdownHook = "default"
	# (Default: true)
	# Unsafe off-thread world random access causes "Accessing LegacyRandomSource from multiple threads" crashes.
	# Keep this check enabled to fail on unsafe access. False produces only a warning.
	enforceSafeWorldRandomAccess = "default"

	[clientSideConfig.modifyMaxVDConfig]
		# (Default: true) Permit a different maximum view distance.
		enabled = "default"
		# (Default: 61) Set the maximum render distance in game options.
		maxViewDistance = "default"

[noTickViewDistance]
	# (Default: true) Enable no-tick view distance.
	enabled = "default"
	# (Default: 6) Limit concurrent no-tick chunk loads.
	# Lower values reduce latency. Higher values load chunks faster.
	maxConcurrentChunkLoads = 3
	# (Default: true) Compatibility mode can resolve chunk transfer conflicts with other mods.
	compatibilityMode = "default"
	# (Default: false) Send chunks twice to keep them correct within the normal render distance.
	# This increases network load.
	ensureChunkCorrectness = "default"

[generalOptimizations]
	# (Default: true) Async chunk requests do not block the server thread.
	# This can conflict with other mods.
	optimizeAsyncChunkRequest = "default"
	# (Default: 100000) Set the mid-tick chunk task interval in nanoseconds. Use -1 to disable it.
	# Tasks run within the server tick loop to improve chunk loads and generation under high MSPT.
	# This can increase MSPT during chunk loads and generation.
	# This conflicts with Dimensional Threading (dimthread).
	midTickChunkTasksInterval = "default"

	[generalOptimizations.autoSave]
		# (Default: ENHANCED)
		# VANILLA saves during each tick. ENHANCED saves when the server has spare time after a tick.
		# PERIODIC saves every 6000 ticks. Keep the quotes.
		mode = "default"
		# (Default: 20000) Set the delay between chunk auto-saves in milliseconds for ENHANCED mode.
		delay = "default"

[ioSystem]
	# (Default: 8192) Set the NBT cache soft limit for I/O workers.
	chunkDataCacheSoftLimit = "default"
	# (Default: 32678) Set the NBT cache hard limit for I/O workers.
	chunkDataCacheLimit = "default"
	# (Default: -1)
	# Compression formats: -1 uses the vanilla default, 1 uses GZip (RFC1952), 2 uses Zlib (RFC1950), 3 uses no compression.
	# Each format is vanilla-compatible. No compression gives the highest speed but uses more disk space.
	# Changes affect only new chunk writes. Existing chunks remain readable. Invalid values use the vanilla default.
	chunkStreamVersion = "default"
	# (Default: false)
	# This experimental serialiser changes chunk writes and can conflict with other mods.
	# Keep regular world backups and report world errors to the C2ME GitHub project.
	# This conflicts with architectury@9.2.14 (*) (defined in c2me).
	gcFreeChunkSerializer = "default"
	# (Default: true) Use the optimised I/O system.
	replaceImpl = "default"
	# (Default: true) Load and unload chunks asynchronously.
	async = "default"

[threadedWorldGen]
	enabled = false
	# (Default: true) Generate world features, such as trees and ores, in parallel.
	# This can conflict with other mods.
	allowThreadedFeatures = false
	# (Default: true) Reduce the lock radius. This can conflict with other mods.
	reduceLockRadius = false
	# (Default: true) Async and parallel schedules reduce server thread load but can conflict with other mods.
	asyncScheduling = false

[vanillaWorldGenOptimizations]
	# (Default: true) Aquifer optimisation speeds up Overworld generation but can conflict with other mods.
	optimizeAquifer = false
	# (Default: true) The End Biome Cache speeds up End generation but can conflict with other mods.
	useEndBiomeCache = false
