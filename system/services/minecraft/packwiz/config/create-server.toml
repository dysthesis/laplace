				rope_pulley = 4.0
				mechanical_crafter = 2.0
				brass_encased_large_cogwheel = 0.0
				chain_conveyor = 1.0
				mechanical_drill = 4.0
				hose_pulley = 4.0
				weighted_ejector = 2.0
				flywheel = 0.0
				mechanical_saw = 4.0
				andesite_encased_large_cogwheel = 0.0
				large_cogwheel = 0.0
				gearbox = 0.0
				deployer = 4.0
				andesite_encased_cogwheel = 0.0
				mysterious_cuckoo_clock = 1.0
				stressometer = 0.0
				encased_chain_drive = 0.0
				rotation_speed_controller = 0.0
				elevator_pulley = 4.0
				brass_encased_cogwheel = 0.0
				belt = 0.0
				cogwheel = 0.0
				copper_backtank = 4.0
				mechanical_mixer = 4.0
				andesite_encased_shaft = 0.0
				mechanical_pump = 4.0
				netherite_backtank = 4.0
				adjustable_chain_gearshift = 0.0
				clutch = 0.0
				mechanical_piston = 4.0
				mechanical_press = 8.0
				encased_fan = 2.0
				gearshift = 0.0
				brass_encased_shaft = 0.0
				cuckoo_clock = 1.0
				speedometer = 0.0
				millstone = 4.0
				shaft = 0.0

			#[in Stress Units]
			# Set the stress capacity of each source.
			[kinetics.stressValues.v2.capacity]
				creative_motor = 16384.0
				large_water_wheel = 128.0
				hand_crank = 8.0
				copper_valve_handle = 8.0
				windmill_bearing = 512.0
				steam_engine = 1024.0
				water_wheel = 32.0

[fluids]
	#[in Blocks]
	# A mechanical pump can push or pull liquids this far on each side.
	#Range: > 1
	mechanicalPumpRange = 16
	pipesPlaceFluidSourceBlocks = true
	#[in Blocks]
	#[-1 to disable this behaviour]
	# A hose pulley treats a fluid source as infinite at this block count.
	#Range: > -1
	hosePulleyBlockThreshold = 10000
	# Permit hose pulleys to fill sources above the infinite source threshold.
	fillInfinite = false
	#[in Blocks]
	#Range: > 1
	fluidTankMaxHeight = 32
	#[in Blocks]
	# Limit the hose pulley draw distance.
	#Range: > 1
	hosePulleyRange = 128
	# Select the fluids that permit an infinite drain.
	#Allowed Values: ALLOW_ALL, DENY_ALL, ALLOW_BY_TAG, DENY_BY_TAG
	bottomlessFluidMode = "ALLOW_BY_TAG"
	#[in Buckets]
	# Set the fluid capacity per tank block.
	#Range: > 1
	fluidTankCapacity = 8
	fluidFillPlaceFluidSourceBlocks = true

[logistics]
	# Wait this many ticks between funnel transfers unless redstone activates the funnel.
	#Range: > 1
	defaultExtractionTimer = 8
	# Wait this many ticks between factory gauge requests.
	#Range: > 5
	factoryGaugeTimer = 100
	# Limit Mechanical Arm reach to this many blocks.
	#Range: > 1
	mechanicalArmRange = 5
	# Wait this many ticks for storage transfers before contraptions move.
	#Range: > 1
	psiTimeout = 60
	# Wait this many ticks between brass tunnel distributions.
	#Range: 1 ~ 10
	brassTunnelTimer = 10
	# Set the vault capacity in stacks per block.
	#Range: 1 ~ 2048
	vaultCapacity = 20
	# Let hostile mobs ride nearby seats.
	seatHostileMobs = true
	# Limit redstone link range to this many blocks.
	#Range: > 1
	linkRange = 256
	# Limit display link range to this many blocks.
	#Range: > 1
	displayLinkRange = 64
	# Place Package Ports within this many blocks of their targets.
	#Range: > 1
	packagePortRange = 5
	#Range: > 1
	chainConveyorCapacity = 20

[schematics]
	# Discard a schematic upload after this many game ticks without a packet.
	#Range: > 100
	schematicIdleTimeout = 600
	# Overwrite earlier schematics when a player exceeds this count.
	#Range: > 1
	maxSchematics = 10
	# Replace world blocks with Air during direct Creative Mode schematic placement.
	creativePrintIncludesAir = false
	#[in KiloBytes]
	#Range: > 16
	maxTotalSchematicSize = 256
	#[in Bytes]
	#Range: 256 ~ 32767
	maxSchematicPacketSize = 1024

	[schematics.schematicannon]
		# Wait this many game ticks between Schematicannon shots.
		#Range: > 1
		schematicannonDelay = 10
		# Print this many blocks for each Gunpowder item.
		#Range: > 1
		schematicannonShotsPerGunpowder = 400

[equipment]
	#Range: > 10
	maxSymmetryWandRange = 50
	# Let Potato Cannon shots place blocks and change entities.
	potatoCannonWorldModification = true
	# Set backtank capacity in seconds of underwater breath.
	#Range: > 1
	airInBacktank = 900
	# Limit Toolbox range for player inventory access.
	#Range: > 1
	toolboxRange = 10
	# Set free Extendo Grip actions per full Copper Backtank. Use 0 for unbreakable Extendo Grips.
	#Range: > 0
	maxExtendoGripActions = 1000
	# Limit placement assist distance between a block and its interaction point.
	#Range: > 3
	placementAssistRange = 12
	# Add this much air for each Capacity Enchantment level on a backtank.
	#Range: > 1
	enchantedBacktankCapacity = 300
	# Set free Potato Cannon shots per full Copper Backtank. Use 0 for unbreakable Potato Cannons.
	#Range: > 0
	maxPotatoCannonShots = 200

[trains]
	#Range: > 1
	maxBogeyCount = 20
	# Limit the Train Station assembly track length.
	#Range: > 5
	maxAssemblyLength = 128
	# Limit track placement to this length for each batch or turn.
	#Range: 16 ~ 128
	maxTrackPlacementLength = 32
	# Let trains hurt mobs and players in collisions.
	trainsCauseDamage = true
	# Set manual Train speed relative to a Scheduled Train.
	#Range: 0.0 ~ 3.4028234663852886E38
	manualTrainSpeedModifier = 0.75

	[trains.poweredTrainStats]
		#[in Blocks/Second]
		#Range: 0.0 ~ 3.4028234663852886E38
		poweredTrainTurningTopSpeed = 20.0
		#[in Blocks/Second]
		#Range: 0.0 ~ 3.4028234663852886E38
		poweredTrainTopSpeed = 40.0
		#[in Blocks/Second²]
		#Range: 0.0 ~ 3.4028234663852886E38
		poweredTrainAcceleration = 3.0

	[trains.trainStats]
		#[in Blocks/Second]
		#Range: 0.0 ~ 3.4028234663852886E38
		trainTurningTopSpeed = 14.0
		#[in Blocks/Second²]
		#Range: 0.0 ~ 3.4028234663852886E38
		trainAcceleration = 3.0
		#[in Blocks/Second]
		#Range: 0.0 ~ 3.4028234663852886E38
		trainTopSpeed = 28.0
