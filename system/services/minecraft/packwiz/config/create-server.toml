[infrastructure]
	#[in Ticks]
	# Send tickrate synchronisation packets at this interval to improve animations below 20 TPS.
	#Range: > 5
	tickrateSyncTimer = 20

[recipes]
	# Destroy this many light sources to turn Chromatic Compound into Refined Radiance.
	#Range: > 1
	lightSourceCountForRefinedRadiance = 10
	# Let the Mechanical Saw process entire stacks.
	bulkCutting = false
	# Let the Mechanical Saw process stonecutting recipes.
	allowStonecuttingOnSaw = true
	#Range: > 1
	maxFireworkIngredientsInCrafter = 9
	# Let Spouts fill the Botania Petal Apothecary.
	allowFillingBySpout = true
	# Let a Mechanical Mixer and Basin process shapeless crafting recipes.
	allowShapelessInMixer = true
	# Let Mechanical Crafters process standard crafting recipes.
	allowRegularCraftingInCrafter = true
	enableRefinedRadianceRecipe = true
	# Let a Mechanical Press and Basin process single-ingredient 2x2 or 3x3 crafting recipes.
	allowShapedSquareInPress = true
	bulkPressing = false
	# Let a Mechanical Mixer and Basin brew supported potions.
	allowBrewingInMixer = true
	enableShadowSteelRecipe = true
	# Let Spouts use Casting Tables and Basins from Tinkers' Construct.
	allowCastingBySpout = true
	# Show vanilla log-strip interactions in JEI.
	displayLogStrippingRecipes = true

[kinetics]
	disableStress = false
	# Select the mobs that ignore Deployer attacks.
	#Allowed Values: ALL, CREEPERS, NONE
	ignoreDeployerAttacks = "CREEPERS"
	# A windmill needs at least this many sail blocks for assembly.
	#Range: > 0
	minimumWindmillSails = 8
	# Set the interval in ticks between ejector collision scans.
	#Range: > 10
	ejectorScanInterval = 120
	# Check Kinetic Block sources at this interval in game ticks.
	#Range: > 5
	kineticValidationFrequency = 60
	# Multiply crank exhaustion from speed by this factor.
	#Range: 0.0 ~ 1.0
	crankHungerMultiplier = 0.009999999776482582
	# Add this many sail blocks to increase windmill speed by 1 RPM.
	#Range: > 1
	windmillSailsPerRPM = 8
	#[in Revolutions per Minute]
	#Range: > 64
	maxRotationSpeed = 256
	# Limit chain conveyor connections to this length in blocks.
	#Range: > 5
	maxChainConveyorLength = 32
	# Limit Weighted Ejector throws to this distance in blocks.
	#Range: > 0
	maxEjectorDistance = 32
	# Limit mechanical belts to this length in blocks.
	#Range: > 5
	maxBeltLength = 20
	#Range: > 1
	maxChainConveyorConnections = 4
	#Range: > 0
	crushingDamage = 4

	[kinetics.encasedFan]
		# Limit fan push distance to this many blocks.
		#Range: > 5
		fanPushDistance = 20
		# Check fan airflow obstructions at this interval in game ticks.
		#Range: > 10
		fanBlockCheckRate = 30
		# Fan processing recipes take this many game ticks.
		#Range: > 0
		fanProcessingTime = 150
		#[in Revolutions per Minute]
		# Fans reach their maximum effect at this rotation speed.
		#Range: > 64
		fanRotationArgmax = 256
		# Limit fan pull distance to this many blocks.
		#Range: > 5
		fanPullDistance = 20

	[kinetics.contraptions]
		#Range: > 1
		maxPistonPoles = 64
		# Limit Mechanical Roller fill depth to this many blocks.
		#Range: > 1
		rollerFillDepth = 12
		#Range: > 1
		maxChassisRange = 16
		survivalContraptionPickup = true
		# Expand the player hitbox to match the contraption hitbox.
		#[Technical]
		syncPlayerPickupHitboxWithContraptionHitbox = false
		# Prevent block drops when a contraption replaces world blocks.
		noDropWhenContraptionReplaceBlocks = false
		#Allowed Values: MOVABLE, NO_PICKUP, UNMOVABLE
		movableSpawners = "NO_PICKUP"
		#Allowed Values: MOVABLE, NO_PICKUP, UNMOVABLE
		movableObsidian = "UNMOVABLE"
		harvesterReplants = true
		# Create separate entities for stabilised bearings, even on stationary contraptions.
		#[Technical]
		stabiliseStableContraptions = false
		# Permit minecart contraptions in container items.
		minecartContraptionInContainers = false
		# Keep items from contraption harvests and mines in mounted storage.
		moveItemsToStorage = true
		harvestPartiallyGrown = false
		# Limit Rope Pulley rope to this length.
		#Range: > 1
		maxRopeLength = 384
		#Allowed Values: MOVABLE, NO_PICKUP, UNMOVABLE
		movableReinforcedDeepslate = "UNMOVABLE"
		# Limit the number of blocks that Pistons, Bearings or other mechanisms can move.
		#Range: > 1
		maxBlocksMoved = 2048
		contraptionPlacing = true
		#Allowed Values: MOVABLE, NO_PICKUP, UNMOVABLE
		amethystMovement = "NO_PICKUP"
		#Range: > 1
		maxCartCouplingLength = 32

	# Set speed and capacity thresholds for requirements and indicators.
	[kinetics.stats]
		#[in Revolutions per Minute]
		# Classify rotation speeds at or above this value as 'fast'.
		#Range: 0.0 ~ 65535.0
		fastSpeed = 100.0
		#[in Stress Units]
		# Classify stress impacts at or above this value as 'high'.
		#Range: 0.0 ~ 65535.0
		highStressImpact = 8.0
		#[in Stress Units]
		# Classify stress impacts at or above this value as 'medium'.
		#Range: 0.0 ~ 4096.0
		mediumStressImpact = 4.0
		#[in Stress Units]
		# Classify source capacities at or above this value as 'medium'.
		#Range: 0.0 ~ 4096.0
		mediumCapacity = 256.0
		#[in Revolutions per Minute]
		# Classify rotation speeds at or above this value as 'medium'.
		#Range: 0.0 ~ 4096.0
		mediumSpeed = 30.0
		#[in Stress Units]
		# Classify source capacities at or above this value as 'high'.
		#Range: 0.0 ~ 65535.0
		highCapacity = 1024.0

		[kinetics.stressValues.v2]

			#[in Stress Units]
