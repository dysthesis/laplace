# Thank you for using Euphoria Patches - SpacEagle17

[display]
	# Log Sodium popup messages.
	# Default = true
	doPopUpLogging = true

	# Show in-game shader messages with Iris or Oculus.
	# Default = true
	doDisplayShaderInGameMessage = true

[updates]
	# Use 'important' for critical or large updates, 'all' for all updates, or 'none' to disable checks.
	# The checker uses the Modrinth API.
	# Default = important
	doUpdateChecking = "none"

[maintenance]
	# Rename outdated Euphoria Patches folders and configuration files for identification.
	# Default = true
	doRenameOldShaderFiles = true

	# Delete outdated Euphoria Patches folders and configuration files.
	# Default = false
	doDeleteOldShaderFiles = false

[debug]
	# The JVM argument -DebugEP=true/false overrides this debug log setting.
	# Default = false
	doDebugLogging = false

[advanced]
	# Generate alternative shader names for different settings, separated by commas.
	# An empty string creates no alternative names.
	# Use {baseVersion} or {patchVersion} to insert the base shader or Euphoria Patches version.
	# Example: Euphoria Saturated, Comp_{baseVersion} + EP_{patchVersion} Dark Settings, EP High Performance
	alternativeShaderNames = ""

	# Merge changed files from "Euphoria Patches/shaders/properties/" into the main block.properties file at the specified interval.
	# Default = false
	autoMergeBlockProperties = false
