#Range: 0 ~ 20
schematicsNestingDepth = 5
# Return remaining items after manual application.
applicationRemainingItemFix = true
# Multiply boiler stress output for Fluid Vessels by this factor.
#Range: 0.0 ~ 3.4028234663852886E38
vesselBoilerStressMultiplier = 0.8125
# Multiply boiler heat for Fluid Vessels by this factor.
#Range: 0.0 ~ 3.4028234663852886E38
vesselHeatMultiplier = 0.5
# Limit the Fluid Vessel boiler level.
#Range: 0 ~ 18
vesselMaxLevel = 18
#Range: 0 ~ 256
batteryDischargeRPM = 64
# Set Kinetic Battery capacity in su-hours.
#Range: 0.0 ~ 8192.0
batteryCapacity = 512.0
# Permit wildcards in both Redstone Link slots. Restart to apply changes.
allowDualWildcardLink = false

	[stressValues.v1]
		# Set the powered brake stress impact in Stress Units.
		#Range: -Infinity ~ Infinity
		brakeActiveStress = 16384.0

		#[in Stress Units]
		# Stress cost doubles with each speed increase.
		[stressValues.v1.impact]
			brass_gearbox = 0.0
			inverted_gearshift = 0.0
			centrifugal_clutch = 0.0
			brake = 0.0
			shear_pin = 0.0
			inverted_clutch = 0.0
			overstress_clutch = 0.0
			encased_chain_cogwheel = 0.0
			six_way_gearbox = 0.0
			parallel_gearbox = 0.0
			freewheel_clutch = 0.0
			kinetic_battery = 64.0

		#[in Stress Units]
		# Set the stress capacity of each source.
		[stressValues.v1.capacity]
			large_crank_wheel = 8.0
			crank_wheel = 8.0
			kinetic_battery = 32.0
