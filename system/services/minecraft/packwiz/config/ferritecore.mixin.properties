# Replace the blockstate neighbour table.
replaceNeighborLookup = true
# Read state properties from the replacement neighbour table. This requires replaceNeighborLookup.
replacePropertyMap = true
cacheMultipartPredicates = true
# Reuse strings for ModelResourceLocations.
modelResourceLocations = true
# Share MultipartBakedModel instances between block states with the same multipart model. This requires cacheMultipartPredicates.
multipartDeduplication = true
# Deduplicate blockstate cache data, including collision and render shapes.
blockstateCacheDeduplication = true
# Deduplicate baked quad vertex data in basic model implementations.
bakedQuadDeduplication = true
# Use smaller data structures for simple models with few side-specific faces.
modelSides = true
# A smaller field replaces chunk thread access detectors. This can cause rare crashes.
useSmallThreadingDetector = false
# Use a smaller but slower block state representation.
compactFastMap = false
# Populate the vanilla neighbour table for mods that access it directly. This increases memory use.
populateNeighborTable = false
