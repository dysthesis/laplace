_version = 4

[server]
	realTimeUpdateDistanceRadiusInChunks = 256
	# Use a unique level key prefix for each backend behind a proxy.
	# An empty prefix uses the server seed hash.
	levelKeyPrefix = ""
	# Keep this distance at least as large as maxGenerationRequestDistance.
	maxSyncOnLoadRequestDistance = 4096
	# Clients receive updated LODs on connection and when new LODs load.
	synchronizeOnLoad = true
	# Use a fixed server key to reuse the LOD folder without a static IP.
	# An empty key lets the client choose the folder name.
	# Reconnect to apply changes.
	serverKey = ""
	# A small generation radius decreases chunk memory use.
	maxGenerationRequestDistance = 64
	# Missing LOD downloads require Distant Generation on the server.
	enableServerGeneration = true
	# Disable this if another method supplies level keys.
	sendLevelKeys = true
	# This generated ID prevents LOD overwrites between independent servers with the same serverKey. Do not change it.
	serverId = 693712174
	# Limit LOD generation requests per second and queued requests per client.
	generationRequestRateLimit = 20
	# Limit LOD sync requests per second and queued requests per client.
	syncOnLoadRateLimit = 50
	# Clients receive real-time updates outside their render distance.
	enableRealTimeUpdates = true
	# Limit total LOD upload speed in KB/s. Use 0 for no limit.
	globalBandwidthLimit = 0
	# Limit LOD upload speed per player in KB/s. Use 0 for no limit.
	playerBandwidthLimit = 500
	# Adjust the transfer rate to client performance to reduce connection lag.
	# False keeps the transfer speed fixed.
	enableAdaptiveTransferSpeed = false

	[server.experimental]
		# Enable this on both client and server to generate terrain with lower detail levels.
		# Use upsampleLowerDetailLodsToFillHoles to improve performance between detail levels.
		enableNSizedGeneration = false

	[common.lodBuilding]
		# Compression changes affect only new or updated LOD data.
		# MERGE_SAME_BLOCKS records each block or biome change. Its expected compression ratio is 1.0.
		# VISUALLY_EQUAL records only visible changes and ignores hidden blocks, such as ores.
		# Its expected compression ratio is 0.7.
		worldCompression = "VISUALLY_EQUAL"
		dataCompression = "Z_STD_BLOCK"
		# DH normally skips unchanged chunks. Disable the check if changed blocks do not update LODs.
		# This increases chunk processing time and CPU demand.
		disableUnchangedChunkCheck = false

		[common.lodBuilding.experimental]
			# Fill missing LOD data from the tree to prevent holes with N-sized generation.
			# This requires N-sized generation or a server with generateOnlyInHighestDetail set to false.
			# This experimental option increases CPU and disk use and can cause render errors.
			upsampleLowerDetailLodsToFillHoles = false

	[common.multiThreading]
		numberOfThreads = 8
		# Set the fraction of time each thread runs before it becomes idle, from 0.0 to 1.0.
		# Use this for finer CPU control, or when the thread count is already 1.
		threadRunTimeRatio = "1.0"
		# Change the Java thread priority if C2ME or DH has thread starvation.
		threadPriority = 5

	[common.logging]
		logRendererEventToFile = "INFO"
		logWorldGenEventToFile = "INFO"
		logRendererGLEventToChat = "ERROR"
		globalChatMaxLevel = "ERROR"
		logWorldGenChunkLoadEventToFile = "INFO"
		logRendererGLEventToFile = "INFO"
		logNetworkEventToFile = "INFO"
		logConnectionConfigChangesToFile = "WARN"
		globalFileMaxLevel = "INFO"

		[common.logging.warning]
			# Show a chat warning when too many chunks await an update.
			showSlowWorldGenSettingWarnings = true
			showUpdateQueueOverloadedChatWarning = false
			showLowMemoryWarningOnStartup = true
			# Show DH information when a replay starts.
			showReplayWarningOnStartup = true
			showModCompatibilityWarningsOnStartup = true
			showHighVanillaRenderDistanceWarning = true
			# Show a chat warning if the garbage collector removes pooled objects.
			showPoolInsufficientMemoryWarning = true
			# Log a warning if the Java garbage collector can cause frame stutter or other problems.
			logGarbageCollectorWarning = true
			# Show a chat warning if the Java garbage collector can cause frame stutter or other problems.
			showGarbageCollectorWarning = true

	[common.worldGenerator]
		# PRE_EXISTING_ONLY creates LOD data only for existing chunks.
		# SURFACE generates the surface without trees or structures.
		# FEATURES generates everything except structures. Some world generator mods can cause errors or instability.
		# INTERNAL_SERVER asks the local server to load or generate chunks, with structures.
		# This mode can cause server or simulation lag. Only this mode saves generated chunks to Minecraft region files.
		distantGeneratorMode = "FEATURES"
		# Use OVERLAY, CHAT, LOG or DISABLED for generation progress.
		# OVERLAY can behave like CHAT on some Minecraft versions.
		showGenerationProgress = "DISABLED"
		# Limit generation to this radius in chunks. Use 0 to follow the render distance without a generation boundary.
		# Use a non-zero limit only for small, pre-generated worlds to avoid gaps within the render distance.
		generationMaxChunkRadius = 0
		generationProgressDisplayIntervalInSeconds = 2
		generationProgressIncludeChunksPerSecond = true
		# Use 0 to hide the disable instructions and show generation progress immediately.
		generationProgressDisableMessageDisplayTimeInSeconds = 20
		generationCenterChunkZ = 0
		# The generator mode selects existing chunk imports, missing chunk generation, or both.
		enableDistantGeneration = true
		generationCenterChunkX = 0

[client]
	showDhOptionsButtonInMinecraftUi = true

		[client.advanced.autoUpdater]
			# AUTO follows the current JAR type: Modrinth stable releases or GitLab nightly builds.
			# Nightly version numbers end with '-dev'.
			updateBranch = "AUTO"
			enableAutoUpdater = false
			# Dedicated servers disable silent updates for stability.
			enableSilentUpdates = false

		[client.advanced.debugging]
			# LOD-only mode disables most vanilla Minecraft graphics.
			# Use it only for debugging. Do not report issues from this mode. Mod compatibility is not guaranteed.
			lodOnlyMode = false
			# DEFAULT uses the LOD renderer. DEBUG_TRIANGLE uses the test renderer. DISABLED stops the renderer.
			rendererMode = "DISABLED"
			# Show overlapping quads in bright red.
			showOverlappingQuadErrors = false
			# Log OpenGL buffer garbage collection and the live buffer count.
			logBufferGarbageCollection = false
			# OFF uses normal LOD colours.
			# SHOW_DETAIL colours LODs by detail level. SHOW_BLOCK_MATERIAL colours them by material.
			# SHOW_OVERLAPPING_QUADS uses white, with red for overlapping quads.
			debugRenderingColors = "OFF"
			# Omit vertex colours to help debug shaders.
			enableWhiteWorld = false
			renderWireframe = false
			# F6 toggles LOD graphics. F7 toggles LOD-only graphics. F8 cycles through debug modes.
			enableDebugKeybindings = false

			[client.advanced.debugging.debugWireframe]
				showRenderSectionStatus = false
				showNetworkSyncOnLoadQueue = false
				showFullDataUpdateStatus = false
				showWorldGenQueue = false
				showQuadTreeRenderStatus = false
				# Debug wireframes increase render time and apply only to objects that load after activation.
				enableRendering = false

			[client.advanced.debugging.openGl]
				# Restart Minecraft to apply changes. This logger also catches OpenGL errors from other mods.
				overrideVanillaGLLogger = true
				# This can catch OpenGL errors from other mods.
				# IGNORE does nothing. LOG records errors. LOG_THROW records errors and throws exceptions.
				# Use LOG_THROW only to debug the LOD renderer. Its exceptions can break the Minecraft renderer.
				glErrorHandlingMode = "IGNORE"
				# Duplicate suppression can hide errors. Disable it if a developer needs the full OpenGL log.
				# This requires overrideVanillaGLLogger.
				onlyLogGlErrorsOnce = true

			[client.advanced.debugging.exampleConfigScreen]
				shortTest = "69"
				mapTest = "{}"
				byteTest = "8"
				longTest = "42069"
				listTest = ["option 1", "option 2", "option 3"]
				boolTest = false
				doubleTest = "420.69"
				floatTest = "0.42069"
				linkableTest = 420
				intTest = 69420
				stringTest = "Test input box"

			[client.advanced.debugging.f3Screen]
				showRenderThreadTasks = false
				# Show the queued chunk count and queue limit.
				showQueuedChunkUpdateCount = true
				showSeparatedObjectPools = false
				showPlayerPos = true
				# Show total memory use and array counts for DH pooled objects.
				showCombinedObjectPools = false
				# Internal detail level 6 means 1x1 block. Level 7 means 2x2 blocks.
				playerPosSectionDetailLevel = 6
				onlyShowRenderingLevels = true
				showThreadPools = true
				# Show loaded levels and their generation and render status.
				showLevelStatus = true

			[client.advanced.debugging.positionFinderDebugging]
				positionFinderEnable = false
				positionFinderMinBlockY = -64
				positionFinderZPos = 0
				positionFinderXPos = 0
				positionFinderMaxBlockY = 125
				positionFinderDetailLevel = 6
				positionFinderMarginPercent = "0.0"

		[client.advanced.graphics]
			enableSsao = true
			# Disable vanilla clouds because they render above DH LODs.
			# Disable vanilla chunk fades because DH already handles them.
			overrideVanillaGraphicsSettings = true

			[client.advanced.graphics.culling]
				# Set the LOD start distance as a percentage of the vanilla render distance.
				# Use -1 for automatic adjustment.
				# Higher values reduce hidden LODs but can cause holes, especially during flight through unloaded terrain.
				# A larger vanilla render distance makes this more effective.
				overdrawPrevention = "-1.0"
				# This controls frustum culling for the DH API shadow pass.
				# Disable it if shadows render incorrectly.
				disableShadowPassFrustumCulling = false
				# List comma-separated block resource locations to replace with water at the water surface.
				waterSubSurfaceBlockReplacementCsv = "minecraft:kelp,minecraft:tall_seagrass,minecraft:seagrass"
				# List comma-separated block resource locations to omit. Air is always included.
				# If holes appear, use MERGE_SAME_BLOCKS for worldCompression and regenerate the LODs.
				ignoredRenderBlockCsv = "minecraft:barrier,minecraft:structure_void,minecraft:light,minecraft:tripwire,minecraft:brown_mushroom"
				# List comma-separated block resource locations to remove above water.
				waterSurfaceBlockReplacementCsv = "minecraft:lily_pad"
				# NONE includes all blocks. NON_COLLIDING omits non-solid blocks, such as tall grass and torches.
				blocksToIgnore = "NON_COLLIDING"
				# Frustum culling omits LODs outside the camera view to reduce GPU use.
				# Disable it if LODs disappear at the corners of the view.
				disableFrustumCulling = false
				# False hides nearby beacons to prevent vanilla overdraw. True renders all beacons.
				# Keep true except for beacon update or render debugging.
				disableBeaconDistanceCulling = true
				# True lets omitted blocks tint the surface below them, such as red flowers above grass.
				# False keeps the surface colour unchanged.
				tintWithAvoidedBlocks = true
				# Cave culling can cause overhangs or walls around floating objects.
				# Adjust caveCullingHeight to reduce these errors.
				enableCaveCulling = true
				# Set the Y coordinate where cave culling starts. Lower it if walls appear in areas without light.
				caveCullingHeight = 60
				# List comma-separated block resource locations to omit underground where sky light is 0.
				# Air is always included. Most transparent, non-solid or liquid blocks are already omitted.
				ignoredRenderCaveBlockCsv = ""
				# Move the overdraw radius closer during fast movement when Minecraft cannot load or generate chunks fast enough.
				reduceOverdrawWithFastMovement = true

			[client.advanced.graphics.noiseTexture]
				# Noise simulates textures to add LOD detail.
				enableNoiseTexture = true
				# Set the noise fade distance in blocks. Use 0 to disable the fade.
				noiseDropoff = 1024
				noiseSteps = 4
				noiseIntensity = "0.05"

			[client.advanced.graphics.experimental]
				# List comma-separated dimension resource locations where DH must not render.
				# Example: "minecraft:the_nether,minecraft:the_end"
				# DH adjusts some settings when its renderer is disabled.
				ignoredDimensionCsv = ""
				# Restart Minecraft to apply changes.
				# AUTO selects the likely API for the Minecraft version.
				# OPEN_GL supports Iris shaders and is the default through MC 1.21.11.
				# BLAZE_3D supports Vulkan and is the default from MC 26.1.2.
				renderingEngine = "AUTO"
				# Earth curvature can cause render errors. Use 0 for a flat world.
				# A ratio of 1 represents 6,371,000 blocks. A ratio of 100 represents 63,710 blocks.
				# Only ratios from 50 to 5000 are supported. Other values disable the effect.
				earthCurveRatio = 0

			[client.advanced.graphics.genericRendering]
				# List comma-separated dimension resource locations for DH clouds, such as "minecraft:overworld,minecraft:the_end".
				# Reload the world to apply changes.
				dimensionEnabledCloudRenderingCsv = "minecraft:overworld"
				enableCloudRendering = true
				# True widens distant beacon beams for visibility. False keeps them 1 block wide.
				expandDistantBeacons = true
				# Set the maximum beacon height. Reload the world to apply changes.
				beaconRenderHeight = 6000
				enableBeaconRendering = true
				# Generic objects include beacon beams and clouds.
				enableGenericRendering = true
				# False renders one cloud layer. True renders three layers at different heights.
				enableMultiLayerClouds = true

			[client.advanced.graphics.quality]
				# Higher detail increases memory and GPU use.
				# LODs per chunk: CHUNK 1, HALF_CHUNK 4, FOUR_BLOCKS 16, TWO_BLOCKS 64, BLOCK 256.
				# BLOCK gives each LOD a width of one block.
				maxHorizontalResolution = "BLOCK"
				# True fades nearby LODs. False cuts them off at a fixed distance.
				# Vanilla overdraw prevention affects this fade.
				ditherDhFade = true
				# Fade before the far clip plane to prevent an abrupt cloud boundary.
				dhFadeFarClipPlane = true
				# True uses the camera position for quality drop-off and supports free-cam mods.
				# False uses the player position and supports multi-camera mods, such as Immersive Portals.
				useCameraPositionForQualityDropOff = true
				# Brightness values: 0 is black, 1 is normal, 2 is near white.
				brightnessMultiplier = "1.0"
				# AUTO follows vanilla block shading. ENABLED forces block shading, even with shaders.
				# DISABLED uses the same brightness for all LOD sides.
				lodShading = "AUTO"
				# Saturation values: 0 is black and white, 1 is normal, 2 is very saturated.
				saturationMultiplier = "1.0"
				# Higher quality improves overhangs, caves and floating islands but increases memory and GPU use.
				# HEIGHT_MAP gives the lowest quality. PIXEL_ART gives the highest quality.
				verticalQuality = "MEDIUM"
				# Set the target render radius in chunks. Other graphics settings can change the actual distance.
				lodChunkRenderDistanceRadius = 256
				# AS_GRASS uses the green top colour on all sides. FADE_TO_DIRT blends grass into dirt.
				# AS_DIRT uses dirt on the sides.
				grassSideRendering = "FADE_TO_DIRT"
				# Higher quality increases the distance between detail drops, memory use and GPU use.
				horizontalQuality = "MEDIUM"
				# COMPLETE permits transparency. DISABLED makes LODs opaque.
				transparency = "COMPLETE"
				# Values above 0 slow LOD loads.
				# Biome blend sizes: 0 means 1x1 or OFF, 1 means 3x3, 2 means 5x5.
				lodBiomeBlending = 3
				# NONE gives the fastest transition but leaves a visible DH boundary.
				# SINGLE_PASS fades after the transparent pass but does not fade opaque blocks underwater.
				# DOUBLE_PASS fades after both passes for the smoothest but slowest transition.
				vanillaFadeMode = "DOUBLE_PASS"

			[client.advanced.graphics.fog]
				# Other mods can conflict with vanilla fog control.
				enableVanillaFog = false
				# Fog thickness: 0.0 is clear, 1.0 is fully opaque.
				farFogMax = "1.0"
				enableDhFog = true
				# Start distances: 0.0 is the player, 1.0 is the nearest vanilla render edge, 1.414 is its corner.
				farFogStart = "0.4"
				# Fog thickness: 0.0 is clear, 1.0 is fully opaque.
				farFogMin = "0.0"
				# USE_WORLD_FOG_COLOR uses the world fog colour. USE_SKY_COLOR uses the sky colour.
				colorMode = "USE_WORLD_FOG_COLOR"
				# LINEAR uses distance and ignores density.
				# EXPONENTIAL: 1/(e^(distance*density))
				# EXPONENTIAL_SQUARED: 1/(e^((distance*density)^2)
				farFogFalloff = "EXPONENTIAL_SQUARED"
				farFogDensity = "2.5"
				# End distances: 0.0 is the player, 1.0 is the nearest vanilla render edge, 1.414 is its corner.
				farFogEnd = "1.0"

				[client.advanced.graphics.fog.heightFog]
					# ABOVE_CAMERA and BELOW_CAMERA start at the camera and extend towards the sky or void.
					# ABOVE_AND_BELOW_CAMERA extends in both directions.
					# ABOVE_SET_HEIGHT, BELOW_SET_HEIGHT and ABOVE_AND_BELOW_SET_HEIGHT use the configured height.
					heightFogDirection = "BELOW_SET_HEIGHT"
					# Fog thickness: 0.0 is clear, 1.0 is fully opaque.
					heightFogMin = "0.0"
					heightFogBaseHeight = "80.0"
					# Fog thickness: 0.0 is clear, 1.0 is fully opaque.
					heightFogMax = "1.0"
					# LINEAR uses height and ignores density.
					# EXPONENTIAL: 1/(e^(height*density))
					# EXPONENTIAL_SQUARED: 1/(e^((height*density)^2)
					heightFogFalloff = "EXPONENTIAL_SQUARED"
					heightFogDensity = "20.0"
					# Combine height fog with far fog.
					# SPHERICAL uses camera distance. CYLINDRICAL uses horizontal distance and ignores height.
					# MAX: max(heightFog, farFog)
					# ADDITION: heightFog + farFog
					# MULTIPLY: heightFog * farFog
					# INVERSE_MULTIPLY: 1 - (1-heightFog) * (1-farFog)
					# LIMITED_ADDITION: farFog + max(farFog, heightFog)
					# MULTIPLY_ADDITION: farFog + farFog * heightFog
					# INVERSE_MULTIPLY_ADDITION: farFog + 1 - (1-heightFog) * (1-farFog)
					# AVERAGE: farFog*0.5 + heightFog*0.5
					heightFogMixMode = "SPHERICAL"
					# Offset values: 0.0 gives no offset, 1.0 gives the full world height, including depth.
					heightFogStart = "0.0"
					# Offset values: 0.0 gives no offset, 1.0 gives the full world height, including depth.
					heightFogEnd = "0.6"

		[client.advanced.multiplayer]
			# Folder name examples:
			# NAME_ONLY: "Minecraft Server"
			# IP_ONLY: "192.168.1.40"
			# NAME_IP: "Minecraft Server IP 192.168.1.40"
			# NAME_IP_PORT: "Minecraft Server IP 192.168.1.40:25565"
			# NAME_IP_PORT_MC_VERSION: "Minecraft Server IP 192.168.1.40:25565 GameVersion 1.16.5"
			serverFolderNameMode = "NAME_ONLY"
