# Generate this much energy per stress unit per tick.
# The default targets Create: Crafts and Additions compatibility.
#Range: 0.0 ~ 1.7976931348623157E308
suToEnergy = 0.029296875
# Limit the number of coils per carbon brush.
#Range: > 0
maxCoils = 8
#Range: 0.0 ~ 1.7976931348623157E308
conductivityMultiplier = 1.0
#Range: > 1
maxPathfindingDepth = 24
#Range: 0.0 ~ 1.7976931348623157E308
energiserSpeedMultiplier = 1.0
# Multiply the overheat temperature by this factor. Use -1 to disable overheating.
#Range: -1.0 ~ 1.7976931348623157E308
overheatingMultiplier = 1.0
# Multiply pipe heat from passive sources, such as lava and boilers, by this factor.
#Range: 0.0 ~ 1.7976931348623157E308
passiveHeatSourceMultiplier = 1.0
# Pipes lose this much heat per second.
#Range: 0.0 ~ 1.7976931348623157E308
passivePipeHeatLoss = 1.0
#Range: 0.0 ~ 1.7976931348623157E308
boilerRequiredHeatMultiplier = 1.0
#Range: 0.0 ~ 1.7976931348623157E308
solarPanelHeatMultiplier = 1.0
#Range: > 1
maxWireLength = 16
#Range: > 0
streetLightCapacity = 10000
# Multiply this energy cost per tick by the current light level.
#Range: > 0
streetLightLevelExtraction = 1

[Motors]
	#Range: > 1
	basicMotorCapacity = 16000
	# Set the motor SU multiplier.
	#Range: 0.0 ~ 1.7976931348623157E308
	motorSuMultiplier = 1.0
	# Set advanced motor output in SU.
	#Range: 1.0 ~ 1.7976931348623157E308
	advancedMotorStress = 2048.0
	#Range: 1.0 ~ 1.7976931348623157E308
	reinforcedMotorSpeed = 256.0
	# Set reinforced motor output in SU.
	#Range: 1.0 ~ 1.7976931348623157E308
	reinforcedMotorStress = 8192.0
	#Range: 1.0 ~ 1.7976931348623157E308
	advancedMotorSpeed = 256.0
	#Range: > 1
	reinforcedMotorCapacity = 128000
	# Set basic motor output in SU.
	#Range: 1.0 ~ 1.7976931348623157E308
	basicMotorStress = 512.0
	#Range: > 1
	advancedMotorCapacity = 64000
	#Range: 1.0 ~ 1.7976931348623157E308
	basicMotorSpeed = 128.0

["Motor Extensions"]
	#Range: 1.0 ~ 1.7976931348623157E308
	basicMotorExtensionMultiplier = 2.0
	#Range: > 1
	basicMotorExtensionExtraCapacity = 64000
	#Range: 1.0 ~ 1.7976931348623157E308
	advancedMotorExtensionMultiplier = 8.0
	#Range: > 1
	basicMotorExtensionScrollStep = 1
	#Range: > 1
	advancedMotorExtensionExtraCapacity = 256000
	#Range: > 1
	advancedMotorExtensionScrollStep = 8

[Reactor]
	# Play a Geiger counter sound for radiation poisoning.
	geigerCounterSounds = true
	# Let charged reactor rod explosions cause fire.
	radiationDamageExplosionFire = true
	# A reactor rod generates this much heat per tick.
	#Range: 0.0 ~ 1.7976931348623157E308
	ReactorRodHeat = 30.0
	nauseaInducingRadiation = true
	# Set explosion strength when a charged reactor rod breaks.
	#Range: 0.0 ~ 1.7976931348623157E308
	radiationDamageExplosionScale = 2.0
	# Limit reactor rods in one direction from a fuel inserter or heat vent.
	#Range: > 0
	maxRodsInDirection = 32
	#Range: 0.0 ~ 1.7976931348623157E308
	reactorOverheatExplosionMultiplier = 0.9
	# A reactor rod loses this much heat per tick above 16000*overheatingMultiplier.
	#Range: 0.0 ~ 1.7976931348623157E308
	ReactorRodHeatLoss = 25.0
