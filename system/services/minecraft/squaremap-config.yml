# Managed in squaremap's data directory; Fabric config/ is ignored.
# Bind to loopback behind Caddy and cap rendering to protect game ticks.
config-version: 2
settings:
  web-address: "@MAP_ORIGIN@"
  internal-webserver:
    bind: 127.0.0.1
world-settings:
  default:
    map:
      max-render-threads: 2
      background-render:
        max-render-threads: 1
        max-chunks-per-interval: 512
