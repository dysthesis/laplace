# Deimos-only pregen overrides; the base pack disables parallel world generation.
# Use spare cores because no players share this host.
# simplification: parallel features may expose races; disable them if crashes recur.

allowThreadedFeatures = true
reduceLockRadius = true
asyncScheduling = true

[vanillaWorldGenOptimizations]
optimizeAquifer = true
useEndBiomeCache = true
